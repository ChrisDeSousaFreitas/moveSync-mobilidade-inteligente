name: Validacao do Move Sync
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    name: API Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e executar testes
        working-directory: backend
        run: mvn --batch-mode verify
  mobile:
    name: Aplicativo React Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        working-directory: mobile
        run: npm install
      - name: Verificar TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Analisar qualidade do código
        working-directory: mobile
        run: npm run lint
