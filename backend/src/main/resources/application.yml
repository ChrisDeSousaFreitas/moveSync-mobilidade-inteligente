spring:
  application:
    name: move-sync-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:movesync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:MoveSync-Dev-Secret-Key-2026-Use-At-Least-32-Bytes}
    expiracao-ms: 86400000
