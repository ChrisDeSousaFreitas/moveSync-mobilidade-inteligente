spring:
  application:
    name: move-sync-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/movesync;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:disabled}
        chat:
          model: gemini-2.5-flash
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:disabled}
          text:
            options:
              model: text-embedding-004
              dimensions: 768
    model:
      chat: google-genai
      embedding:
        text: google-genai
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        table-name: vector_store_gemini
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:MoveSync-Dev-Secret-Key-2026-Use-At-Least-32-Bytes}
    expiracao-ms: 86400000
  ai:
    enabled: ${APP_AI_ENABLED:false}
