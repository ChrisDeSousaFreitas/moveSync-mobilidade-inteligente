services:
  banco:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: movesync
      POSTGRES_USER: movesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movesync-local}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./docker/pgvector-init.sql:/docker-entrypoint-initdb.d/pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movesync -d movesync"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://banco:5432/movesync
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_USERNAME: movesync
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-movesync-local}
      JWT_SECRET: ${JWT_SECRET:-MoveSync-Local-Compose-Secret-Change-Before-Publishing}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-disabled}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      APP_AI_RAG_ENABLED: ${APP_AI_RAG_ENABLED:-false}
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "8080:8080"
  ml:
    build: ./ml-service
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dados-ml:/app/models
volumes:
  dados-postgres:
  dados-ml:
