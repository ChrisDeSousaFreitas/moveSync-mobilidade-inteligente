services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movesync
      POSTGRES_USER: movesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movesync-local}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movesync -d movesync"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://banco:5432/movesync
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_USERNAME: movesync
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-movesync-local}
      JWT_SECRET: ${JWT_SECRET:-MoveSync-Local-Compose-Secret-Change-Before-Publishing}
    ports:
      - "8080:8080"
volumes:
  dados-postgres:
